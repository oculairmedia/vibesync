[formula.code-review]
description = "Review a code change with a reviewer → coder → tester loop. The reviewer reads the diff and produces a verdict; the coder applies fixes if requested; the tester verifies the result. Each step blocks on the previous."
when_to_use = "when a bead represents a concrete code change that needs an objective second pass before merge — diff is already written, you want review + fix + verification in one pass. Do NOT use for ambiguous backlog items that need decomposition first; use onboard-feature for those."

[[formula.code-review.steps]]
role = "reviewer"
prompt_template = "prompts/reviewer-system.md"
wait_for = "completion"

[[formula.code-review.steps]]
role = "coder"
prompt_template = "prompts/coder-system.md"
depends_on = "reviewer"
wait_for = "completion"
# vibesync-lcp-98y8: coder steps can legitimately run long (substantial refactors, large PRs)
turn_timeout_ms = 1200000  # 20 minutes

[[formula.code-review.steps]]
role = "tester"
prompt_template = "prompts/tester-system.md"
depends_on = "coder"
wait_for = "completion"
