[formula.onboard-feature]
description = "Take a feature request from intent → spec → implementation → review → verification. Mayor decomposes the work, coder implements, reviewer signs off, tester verifies."
delivers = "pull_request"
when_to_use = "when a bead represents a feature request or backlog item with no concrete diff yet — needs decomposition into spec + implementation. Mayor step decides architecture and ordering; subsequent steps execute. Use this for new work; use code-review when a change is already drafted."

[[formula.onboard-feature.steps]]
role = "mayor"
prompt_template = "prompts/mayor-system.md"
wait_for = "completion"
# vibesync-9lzk.37: the mayor plans; the engine fails its step if it opened the PR itself.
plan_only = true

[[formula.onboard-feature.steps]]
role = "coder"
prompt_template = "prompts/coder-system.md"
depends_on = "mayor"
wait_for = "completion"

[[formula.onboard-feature.steps]]
role = "reviewer"
prompt_template = "prompts/reviewer-system.md"
depends_on = "coder"
wait_for = "completion"
# vibesync-9lzk.24: a blocking review sends the work back to the coder for
# another round; after 3 blocked rounds the run fails and escalates.
loops_back_to = "coder"
max_rounds = 3

[[formula.onboard-feature.steps]]
role = "tester"
prompt_template = "prompts/tester-system.md"
depends_on = "reviewer"
wait_for = "completion"
