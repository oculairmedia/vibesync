SPECIFICATION Spec
CONSTANTS
  Steps = {"coder", "reviewer", "tester"}
  MaxParallel = 2
  MaxAttempts = 2
  Fence = "none"
  FenceAt = "before_judge"
  CancelMode = "single_writer"
  CancelRecords = "fresh"
  RecheckBeforeStart = FALSE
  UnwindTimeout = TRUE
  WriteOutlastsWait = FALSE
  Deps <- FanDeps
INVARIANTS TypeOK NoStepStartsEarly ParallelLimit ClosedRootHasOnlyClosedSteps CompletedMeansAllDone RootClosedHasOutcome NoUnruledStepAtRest
PROPERTIES StepResultIsFinal EventuallySettles
