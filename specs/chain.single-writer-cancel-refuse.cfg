SPECIFICATION Spec
CONSTANTS
  Steps = {"mayor", "coder", "reviewer"}
  MaxParallel = 2
  MaxAttempts = 2
  Fence = "none"
  FenceAt = "before_judge"
  CancelMode = "single_writer"
  CancelRecords = "fresh"
  RecheckBeforeStart = TRUE
  CancelRefuses = TRUE
  CloseSweeps = "all"
  StartCAS = TRUE
  UnwindTimeout = FALSE
  WriteOutlastsWait = FALSE
  Deps <- ChainDeps
INVARIANTS TypeOK CancelledRootIsCancelled NoStrandedStep NoStepStartsEarly ParallelLimit ClosedRootHasOnlyClosedSteps CompletedMeansAllDone RootClosedHasOutcome NoUnruledStepAtRest
PROPERTIES StepResultIsFinal EventuallySettles RootOutcomeIsFinal
