name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # lcp-uye8: typecheck gate. A non-compiling change must NOT be mergeable.
  # This job is wired as a REQUIRED status check on origin/main so a PR that
  # fails `tsc --noEmit` is blocked (the kamu incident: broken TS pushed
  # straight to main because CI only ran tests, not the typecheck).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # Production installs with bun (bun.lock); npm ci took ~100 s here.
        # --ignore-scripts: node-pty (via @letta-ai/letta-code) has no linux-x64
        # prebuild and its script runs node-gyp@latest, which fails on the
        # runner. Only better-sqlite3's native build is needed; rebuild it alone.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
      - name: Type check (tsc --noEmit)
        run: npm run type-check

  # vibesync-9lzk.28: boot the REAL entry point (bun src/index.ts, what
  # vibesync.service runs) and require /health to answer. Unit tests never
  # start the process: PR #84 passed typecheck, 981 tests and CI while its
  # main.ts change meant the service would start and do nothing.
  boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # Same install as the typecheck job (see there for why scripts are skipped).
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
      - name: Boot check (bun src/index.ts answers /health)
        run: scripts/ci/boot-check.sh 60

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Production installs with bun (bun.lock); npm ci took ~100 s per job.
        # See the typecheck job for why scripts are skipped and one is rebuilt.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Install pinned bd for isolated integration suites
        if: matrix.node-version == '20.x'
        run: |
          set -euo pipefail
          archive=beads_1.3.2_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/gastownhall/beads/releases/download/v1.3.2/$archive"
          echo "c6ea3281f6ff82628351b2d0967c9eb85862c8a0ec0ebc24e63e645c8b02462e  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bd"
          bd_binary="$(find "$RUNNER_TEMP/bd" -type f -name bd -print -quit)"
          test -n "$bd_binary"
          chmod +x "$bd_binary"
          "$bd_binary" version
          echo "VIBESYNC_BD_BINARY=$bd_binary" >> "$GITHUB_ENV"

      # One test run per job. On 20.x that run also collects coverage; it used
      # to run the full suite twice more (test:coverage, then the threshold
      # step re-ran test:coverage), ~140 s each. The gate is the same suite.
      - name: Run tests
        if: matrix.node-version != '20.x'
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '20.x'
        env:
          VIBESYNC_TEST_BD: ${{ env.VIBESYNC_BD_BINARY }}
          VIBESYNC_TEST_BD_WAKES: ${{ env.VIBESYNC_BD_BINARY }}
          VIBESYNC_TEST_BD_WAITS: ${{ env.VIBESYNC_BD_BINARY }}
        run: bun run build:openapi && bunx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Report coverage summary
        if: matrix.node-version == '20.x'
        run: |
          # Informational, as before: the old step never enforced a threshold.
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage report generated successfully"
          fi

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            coverage/
            html/
          retention-days: 30
