services:
  vibesync:
    image: ghcr.io/oculairmedia/huly-vibe-sync:latest
    container_name: vibesync
    restart: unless-stopped
    environment:
      # Vibe Kanban Configuration
      - VIBE_MCP_URL=${VIBE_MCP_URL:-http://192.168.50.90:9717/mcp}
      - VIBE_API_URL=${VIBE_API_URL:-http://192.168.50.90:3105/api}

      # Change Watcher (webhook-driven sync)
      # Uses host LAN IP (not Docker bridge) — vibesync runs in host network mode
      - WEBHOOK_CALLBACK_URL=${WEBHOOK_CALLBACK_URL:-http://192.168.50.90:3099/webhook}

      # Sync Configuration
      - SYNC_INTERVAL=${SYNC_INTERVAL:-60000} # 60 seconds fallback (webhook is primary)
      - INCREMENTAL_SYNC=${INCREMENTAL_SYNC:-true}
      - PARALLEL_SYNC=${PARALLEL_SYNC:-true}
      - MAX_WORKERS=${MAX_WORKERS:-5}
      - SKIP_EMPTY_PROJECTS=${SKIP_EMPTY_PROJECTS:-true}
      - DRY_RUN=${DRY_RUN:-false}

      # Stacks Directory
      - STACKS_DIR=${STACKS_DIR:-/opt/stacks}

      # Letta Integration
      - LETTA_BASE_URL=${LETTA_BASE_URL}
      - LETTA_PASSWORD=${LETTA_PASSWORD}
      - LETTA_MODEL=${LETTA_MODEL:-anthropic/sonnet-4-5}
      - LETTA_EMBEDDING=${LETTA_EMBEDDING:-letta/letta-free}
      - LETTA_ATTACH_REPO_DOCS=${LETTA_ATTACH_REPO_DOCS:-true}
      - LETTA_UPLOAD_PROJECT_FILES=false
      - LETTA_UPLOAD_FULL_SOURCE=false
      - LETTA_SEND_MESSAGES=${LETTA_SEND_MESSAGES:-false}
      - LETTA_CONTROL_AGENT=${LETTA_CONTROL_AGENT:-PM-Control}
      - LETTA_SYNC_TOOLS_FROM_CONTROL=${LETTA_SYNC_TOOLS_FROM_CONTROL:-true}
      - LETTA_SYNC_TOOLS_FORCE=${LETTA_SYNC_TOOLS_FORCE:-false}
      - LETTA_INCREMENTAL_SYNC=${LETTA_INCREMENTAL_SYNC:-true}

      # Performance
      - API_DELAY=${API_DELAY:-10}
      - HEALTH_PORT=${HEALTH_PORT:-3099}

      # Graphiti Knowledge Graph Integration
      - GRAPHITI_ENABLED=${GRAPHITI_ENABLED:-false}
      - GRAPHITI_API_URL=${GRAPHITI_API_URL:-http://192.168.50.219:8003}
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-vibesync}
      - GRAPHITI_AST_ENABLED=${GRAPHITI_AST_ENABLED:-true}

      # Code Perception (Real-time file watching for Graphiti)
      - CODE_PERCEPTION_ENABLED=${CODE_PERCEPTION_ENABLED:-false}
      - CODE_PERCEPTION_DEBOUNCE_MS=${CODE_PERCEPTION_DEBOUNCE_MS:-2000}
      - CODE_PERCEPTION_BATCH_SIZE=${CODE_PERCEPTION_BATCH_SIZE:-50}
      - CODE_PERCEPTION_EXCLUDE_PATTERNS=${CODE_PERCEPTION_EXCLUDE_PATTERNS:-}
      - CODE_PERCEPTION_SOURCE_ROOTS=${CODE_PERCEPTION_SOURCE_ROOTS:-}
      - CODE_PERCEPTION_ALLOWLIST_MODE=${CODE_PERCEPTION_ALLOWLIST_MODE:-false}
      - AST_EXCLUDE_PATTERNS=${AST_EXCLUDE_PATTERNS:-}

      # Node Environment
      - NODE_ENV=production

      # Temporal Orchestration
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-localhost:7233}
      - USE_TEMPORAL_ORCHESTRATION=${USE_TEMPORAL_ORCHESTRATION:-true}
      - USE_TEMPORAL_VIBE=${USE_TEMPORAL_VIBE:-false}

      # Beads/DoltHub per-project remote provisioning
      - DOLTHUB_PROVISIONING_ENABLED=${DOLTHUB_PROVISIONING_ENABLED:-false}
      - DOLTHUB_PROVISIONING_DRY_RUN=${DOLTHUB_PROVISIONING_DRY_RUN:-true}
      - DOLTHUB_API_TOKEN=${DOLTHUB_API_TOKEN}
      - DOLTHUB_API_URL=${DOLTHUB_API_URL:-https://www.dolthub.com/api/v1alpha1}
      - DOLTHUB_OWNER=${DOLTHUB_OWNER:-oulair}
      - DOLTHUB_DEFAULT_VISIBILITY=${DOLTHUB_DEFAULT_VISIBILITY:-private}
      - DOLTHUB_REMOTE_NAME=${DOLTHUB_REMOTE_NAME:-origin}

    volumes:
      # Logs directory
      - ./logs:/app/logs

      # Use local source code (override image bundle)
      - ./index.js:/app/index.js:ro
      - ./cli.js:/app/cli.js:ro
      - ./src:/app/src:ro
      - ./lib:/app/lib:ro
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro

      # Temporal workflows and activities
      - ./temporal/dist:/app/temporal/dist:ro
      - ./node_modules/@temporalio:/app/node_modules/@temporalio:ro
      - ./node_modules/nexus-rpc:/app/node_modules/nexus-rpc:ro
      - ./node_modules/long:/app/node_modules/long:ro
      - ./node_modules/protobufjs:/app/node_modules/protobufjs:ro
      - ./node_modules/@protobufjs:/app/node_modules/@protobufjs:ro
      - ./node_modules/@grpc:/app/node_modules/@grpc:ro
      - ./node_modules/@js-sdsl:/app/node_modules/@js-sdsl:ro
      - ./node_modules/abort-controller:/app/node_modules/abort-controller:ro
      - ./node_modules/uuid:/app/node_modules/uuid:ro

      # Dolt SQL client (mysql2 + deps)
      - ./node_modules/mysql2:/app/node_modules/mysql2:ro
      - ./node_modules/aws-ssl-profiles:/app/node_modules/aws-ssl-profiles:ro
      - ./node_modules/denque:/app/node_modules/denque:ro
      - ./node_modules/generate-function:/app/node_modules/generate-function:ro
      - ./node_modules/iconv-lite:/app/node_modules/iconv-lite:ro
      - ./node_modules/lru.min:/app/node_modules/lru.min:ro
      - ./node_modules/named-placeholders:/app/node_modules/named-placeholders:ro
      - ./node_modules/sql-escaper:/app/node_modules/sql-escaper:ro
      - ./node_modules/safer-buffer:/app/node_modules/safer-buffer:ro
      - ./node_modules/is-property:/app/node_modules/is-property:ro

      # Letta agent persistence (read-write for storing agent IDs)
      - ./.letta:/app/.letta

      # Access to stacks directory (read-write for state persistence)
      - /opt/stacks:/opt/stacks:rw

      # Beads CLI with Dolt/CGO support for project-local tracker hydration
      - /usr/local/bin/bd:/usr/local/bin/bd:ro
      - /usr/local/bin/dolt:/usr/local/bin/dolt:ro

    network_mode: host
    user: '1000:1000'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:${HEALTH_PORT:-3099}/health | grep -q ''"status": "healthy"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  vibesync-ui:
    image: node:18-alpine
    container_name: vibesync-ui
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'server.js']
    environment:
      - API_URL=${API_URL:-http://192.168.50.90:3099}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./ui/.next/standalone:/app
      - ./ui/.next/static:/app/.next/static
      - ./ui/public:/app/public
    expose:
      - '3000'
    labels:
      - homepage.group=Productivity
      - homepage.name=Vibesync UI
      - homepage.icon=si-react
      - homepage.href=http://192.168.50.90:3110
      - homepage.description=Project synchronization dashboard
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  vibesync-nginx:
    image: nginx:alpine
    container_name: vibesync-nginx
    restart: unless-stopped
    ports:
      - '${UI_PORT:-3110}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
